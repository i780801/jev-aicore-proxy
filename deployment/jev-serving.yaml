apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: jev-proxy-serving
  annotations:
    scenarios.ai.sap.com/id: "jev-proxy"
    scenarios.ai.sap.com/name: "jev-proxy"
    scenarios.ai.sap.com/description: "Jev TypeSafe proxy via OpenRouter"
    executables.ai.sap.com/id: "jev-proxy-serving"
    executables.ai.sap.com/name: "jev-proxy-serving"
    executables.ai.sap.com/description: "FastAPI proxy for jev-1.13 via OpenRouter"
  labels:
    scenarios.ai.sap.com/id: "jev-proxy"
    executables.ai.sap.com/id: "jev-proxy-serving"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters: []
    artifacts: []
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      labels:
        ai.sap.com/resourcePlan: "starter"
    spec:
      predictor:
        imagePullSecrets:
          - name: ghcr-secret
        containers:
          - name: kserve-container
            image: ghcr.io/i780801/jev-proxy:1.0.0
            ports:
              - containerPort: 8080
                protocol: TCP
            command: ["uvicorn"]
            args:
              - "server:app"
              - "--host"
              - "0.0.0.0"
              - "--port"
              - "8080"
            env:
              - name: OPENROUTER_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: openrouter-key
                    key: OPENROUTER_API_KEY
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "1"
                memory: "512Mi"
            readinessProbe:
              httpGet:
                path: /v2/health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /v2/health
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 30
              failureThreshold: 3
